<line x1="200.0" y1="272.0" x2="287.8" y2="238.3" stroke="#1e7e45" stroke-width="2.0" marker-end="url(#a2)"/>
<text x="308.6" y="235.9" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">m=1</text>
<line x1="200.0" y1="272.0" x2="269.9" y2="209.1" stroke="#b07808" stroke-width="2.0" marker-end="url(#a3)"/>
<text x="287.2" y="201.1" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">m=2</text>
<line x1="200.0" y1="272.0" x2="242.7" y2="188.2" stroke="#8e6bb0" stroke-width="2.0" marker-end="url(#a4)"/>
<text x="254.8" y="176.2" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" font-style="normal" fill="#8e6bb0" text-anchor="middle" opacity="1.0">m=3</text>
<text x="200.0" y="404.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">R(m . theta) x</text>
<text x="200.0" y="426.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="middle" opacity="1.0">the length never changes, only the angle</text>
<rect x="370.0" y="112.0" width="300.0" height="330.0" rx="8" fill="#fbfdfa" stroke="#1e7e45" stroke-width="1.6" fill-opacity="1.0"/>
<text x="520.0" y="138.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">why it encodes relative position</text>
<text x="520.0" y="180.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">&lt; R(m.theta) q ,  R(n.theta) k &gt;</text>
<text x="520.0" y="202.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0"></text>
<text x="520.0" y="224.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">=  q^T R(m.theta)^T R(n.theta) k</text>
<text x="520.0" y="246.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0"></text>
<text x="520.0" y="268.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">=  q^T R( (n - m) . theta ) k</text>
<rect x="392.0" y="302.0" width="256.0" height="44.0" rx="5" fill="#e4f1e1" stroke="#1e7e45" stroke-width="1.3" fill-opacity="1.0"/>
<text x="520.0" y="330.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">depends only on  n - m</text>
<text x="520.0" y="374.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">absolute positions cancel inside the</text>
<text x="520.0" y="391.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">dot product, so an attention score only</text>
<text x="520.0" y="408.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">ever sees the distance between tokens</text>
<rect x="690.0" y="112.0" width="300.0" height="330.0" rx="8" fill="#fff9e6" stroke="#b07808" stroke-width="1.6" fill-opacity="1.0"/>
<text x="840.0" y="138.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">one frequency per dimension</text>
<text x="840.0" y="160.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">theta_i = 10000 ^ (-i/128),   head_dim = 256</text>
<text x="740.0" y="190.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">i</text>
<text x="820.0" y="190.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">theta_i</text>

<rect x="444.0" y="510.0" width="33.0" height="30.0" rx="3" fill="#f6ddb0" stroke="#b07808" stroke-width="1.2" fill-opacity="1.0"/>
<text x="460.5" y="530.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="normal" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">x133</text>
<text x="210.0" y="556.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" font-style="normal" fill="#2c6fa8" text-anchor="middle" opacity="1.0">first half</text>
<text x="390.0" y="556.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">second half</text>
<text x="300.0" y="584.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">rotate_half(x) = cat((-x2, x1), dim=-1)</text>
<text x="740.0" y="518.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">a permutation of the paper's layout -</text>
<text x="740.0" y="535.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">equivalent up to a fixed reordering of the</text>
<text x="740.0" y="552.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">head dimension, and far cheaper to compute</text>
<text x="740.0" y="584.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="bold" font-style="normal" fill="#2c6fa8" text-anchor="middle" opacity="1.0">q_embed = q * cos  +  rotate_half(q) * sin</text>
<rect x="50.0" y="646.0" width="940.0" height="73.0" rx="5" fill="#e8f4f8" stroke="#2c6fa8" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="50.0" y="646.0" width="4" height="73.0" fill="#2c6fa8"/>
<text x="64.0" y="668.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">RoPE is applied inside every attention layer, to Q and K only - never to V, and never to the residual stream.</text>
<text x="64.0" y="685.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">That is the key difference from the additive sinusoids of the original Transformer, and it is what lets the KV</text>
<text x="64.0" y="702.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">cache work unchanged: a cached key was already rotated by its own position and stays valid forever.</text>
</svg>

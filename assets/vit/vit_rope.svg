<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730">
<defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c6ced5"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6fa8"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e7e45"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b07808"/></marker><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e6bb0"/></marker></defs>
<rect width="1040" height="730" fill="#ffffff"/>
<text x="520.0" y="30.0" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">Rotary positional embeddings</text>
<text x="520.0" y="56.0" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="normal" font-style="italic" fill="#4a5a6a" text-anchor="middle" opacity="1.0">position is injected by rotating each 2-D slice of Q and K, not by adding a vector</text>
<rect x="50.0" y="112.0" width="300.0" height="330.0" rx="8" fill="#fbfdff" stroke="#2c6fa8" stroke-width="1.6" fill-opacity="1.0"/>
<text x="200.0" y="138.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#2c6fa8" text-anchor="middle" opacity="1.0">one 2-D pair, four positions</text>
<circle cx="200.0" cy="272.0" r="94.0" fill="none" stroke="#d8dde2" stroke-width="1.2"/>
<line x1="90.0" y1="272.0" x2="310.0" y2="272.0" stroke="#c6ced5" stroke-width="1.0" marker-end="url(#a0)"/>
<line x1="200.0" y1="382.0" x2="200.0" y2="162.0" stroke="#c6ced5" stroke-width="1.0" marker-end="url(#a0)"/>

<text x="740.0" y="262.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">64</text>
<text x="820.0" y="262.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">1e-2</text>
<text x="930.0" y="262.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">628 positions</text>
<text x="740.0" y="284.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">96</text>
<text x="820.0" y="284.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">1e-3</text>
<text x="930.0" y="284.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">6283 positions</text>
<text x="740.0" y="306.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">127</text>
<text x="820.0" y="306.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">1.1e-4</text>
<text x="930.0" y="306.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">58500 positions</text>
<text x="840.0" y="354.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">low dimensions spin fast and resolve</text>
<text x="840.0" y="371.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">neighbours; high dimensions spin so</text>
<text x="840.0" y="388.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">slowly that they act as a coarse</text>
<text x="840.0" y="405.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">absolute-position signal</text>
<rect x="50.0" y="466.0" width="940.0" height="158.0" rx="8" fill="#fbfcfd" stroke="#51606e" stroke-width="1.5" fill-opacity="1.0"/>
<text x="520.0" y="492.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">rotate_half pairs (i, i + d/2), not the paper's (2i, 2i+1)</text>

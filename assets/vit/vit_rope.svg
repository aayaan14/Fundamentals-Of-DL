<rect x="372.0" y="510.0" width="33.0" height="30.0" rx="3" fill="#f6ddb0" stroke="#b07808" stroke-width="1.2" fill-opacity="1.0"/>
<text x="388.5" y="530.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="normal" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">x131</text>
<rect x="408.0" y="510.0" width="33.0" height="30.0" rx="3" fill="#f6ddb0" stroke="#b07808" stroke-width="1.2" fill-opacity="1.0"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<defs></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="30.0" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">Why softmax is always computed with the max subtracted</text>
<text x="500.0" y="56.0" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="normal" font-style="italic" fill="#4a5a6a" text-anchor="middle" opacity="1.0">softmax is shift invariant, so we are free to pick the shift that cannot overflow</text>
<rect x="220.0" y="92.0" width="560.0" height="40.0" rx="5" fill="#fff9e6" stroke="#f39c12" stroke-width="1.3" fill-opacity="1.0"/>
<text x="500.0" y="118.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">softmax(z)_i  =  exp(z_i - c) / SUM_j exp(z_j - c)    for any constant c</text>
<rect x="40.0" y="162.0" width="440.0" height="300.0" rx="8" fill="#fff7f6" stroke="#c0392b" stroke-width="1.6" fill-opacity="1.0"/>
<text x="260.0" y="188.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#c0392b" text-anchor="middle" opacity="1.0">naive:  c = 0</text>
<text x="70.0" y="220.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">z</text>
<text x="190.0" y="220.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#c0392b" text-anchor="start" opacity="1.0">[   90.0,    100.0,    110.0 ]</text>
<text x="70.0" y="250.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">exp(z)</text>
<text x="190.0" y="250.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#c0392b" text-anchor="start" opacity="1.0">[    inf,      inf,      inf ]</text>
<text x="70.0" y="280.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">SUM</text>
<text x="190.0" y="280.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#c0392b" text-anchor="start" opacity="1.0">inf</text>
<text x="70.0" y="310.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">softmax</text>
<text x="190.0" y="310.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#c0392b" text-anchor="start" opacity="1.0">[    nan,      nan,      nan ]</text>
<text x="260.0" y="354.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#c0392b" text-anchor="middle" opacity="1.0">float32 exp overflows above z = 88.7</text>
<text x="260.0" y="375.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="middle" opacity="1.0">the whole row becomes nan, so one bad</text>
<text x="260.0" y="396.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="middle" opacity="1.0">logit poisons every probability</text>
<rect x="520.0" y="162.0" width="440.0" height="300.0" rx="8" fill="#f6fbf5" stroke="#1e7e45" stroke-width="1.6" fill-opacity="1.0"/>
<text x="740.0" y="188.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" font-weight="bold" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">stabilised:  c = max(z)</text>
<text x="550.0" y="220.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">z - max</text>
<text x="670.0" y="220.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">[  -20.0,    -10.0,      0.0 ]</text>
<text x="550.0" y="250.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">exp(.)</text>
<text x="670.0" y="250.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">[ 2.1e-9,   4.5e-5,      1.0 ]</text>
<text x="550.0" y="280.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">SUM</text>
<text x="670.0" y="280.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">1.0000454</text>
<text x="550.0" y="310.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="start" opacity="1.0">softmax</text>
<text x="670.0" y="310.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">[ 2.1e-9,   4.5e-5,  0.99995 ]</text>
<text x="740.0" y="354.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#1e7e45" text-anchor="middle" opacity="1.0">the largest exponent is now exactly 1</text>
<text x="740.0" y="375.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="middle" opacity="1.0">so the sum lies in [1, N] and nothing can</text>
<text x="740.0" y="396.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="middle" opacity="1.0">overflow; tiny terms underflow to 0 harmlessly</text>
<rect x="40.0" y="492.0" width="920.0" height="73.0" rx="5" fill="#e8f4f8" stroke="#2c6fa8" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="40.0" y="492.0" width="4" height="73.0" fill="#2c6fa8"/>
<text x="54.0" y="514.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">PyTorch already does this for you — but only if you let the framework do the reduction. That is why the code calls</text>
<text x="54.0" y="531.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">nn.functional.softmax(attn_weights, dim=-1, dtype=torch.float32) and casts back afterwards: the accumulation</text>
<text x="54.0" y="548.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">happens in fp32 even when the model runs in bf16, where the exponent range is far tighter than float32's.</text>
</svg>

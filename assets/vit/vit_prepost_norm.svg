<text x="238.0" y="566.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="start" opacity="1.0">to next layer</text>
<text x="738.0" y="594.0" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="start" opacity="1.0">to next layer</text>
<text x="230.0" y="588.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">h = LN(x + MHA(x));  y = LN(h + MLP(h))</text>
<text x="730.0" y="588.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">h = x + MHA(LN(x));   y = h + MLP(LN(h))</text>
<rect x="40.0" y="630.0" width="880.0" height="73.0" rx="5" fill="#e4f1e1" stroke="#1e7e45" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="40.0" y="630.0" width="4" height="73.0" fill="#1e7e45"/>
<text x="54.0" y="652.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">In post-norm the residual stream is re-normalised on the way out, so the identity path is never clean — the</text>
<text x="54.0" y="669.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">signal is rescaled at every one of the 27 layers. In pre-norm the + is the last thing that happens, so there is an</text>
<text x="54.0" y="686.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">unbroken identity highway from layer 27 back to layer 1. It is the ResNet argument, applied to depth in tokens.</text>
</svg>

<text x="565.0" y="294.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">final_embedding   (1, Seq_Len, 2048)</text>
<rect x="180.0" y="302.0" width="300.0" height="46.0" rx="4" fill="#fff9e6" stroke="#b07808" stroke-width="1.5" fill-opacity="1.0"/>

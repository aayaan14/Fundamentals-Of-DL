<text x="168.0" y="156.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="end" opacity="1.0">input_ids</text>

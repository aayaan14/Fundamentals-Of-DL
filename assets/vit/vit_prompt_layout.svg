<text x="330.0" y="338.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">scaled_image_features)</text>
<rect x="480.0" y="302.0" width="470.0" height="46.0" rx="4" fill="#f2ecf8" stroke="#8e6bb0" stroke-width="1.5" fill-opacity="1.0"/>
<text x="715.0" y="322.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">torch.where(text_mask,</text>
<text x="715.0" y="338.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">embed_tokens(input_ids), 0)</text>
<text x="168.0" y="331.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="end" opacity="1.0">embeddings</text>
<rect x="60.0" y="378.0" width="440.0" height="104.0" rx="7" fill="#fff9e6" stroke="#b07808" stroke-width="1.5" fill-opacity="1.0"/>
<text x="280.0" y="402.0" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">the image path</text>
<text x="280.0" y="426.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">/ sqrt(2048)      in the merge</text>
<text x="280.0" y="444.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">* sqrt(2048)      in GemmaModel</text>
<text x="280.0" y="462.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">net scale:  x 1</text>
<rect x="540.0" y="378.0" width="440.0" height="104.0" rx="7" fill="#f2ecf8" stroke="#8e6bb0" stroke-width="1.5" fill-opacity="1.0"/>
<text x="760.0" y="402.0" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="bold" font-style="normal" fill="#8e6bb0" text-anchor="middle" opacity="1.0">the text path</text>
<text x="760.0" y="426.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">(nothing)         in the merge</text>
<text x="760.0" y="444.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">* sqrt(2048)      in GemmaModel</text>
<text x="760.0" y="462.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">net scale:  x 45.25</text>
<rect x="60.0" y="500.0" width="920.0" height="73.0" rx="5" fill="#e8f4f8" stroke="#2c6fa8" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="60.0" y="500.0" width="4" height="73.0" fill="#2c6fa8"/>
<text x="74.0" y="522.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">That asymmetry is deliberate. Gemma's embedding table was pre-trained expecting the sqrt(d) normaliser, so</text>
<text x="74.0" y="539.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">text embeddings must keep it; the projector's output is already at the right scale, so the merge divides it out</text>
<text x="74.0" y="556.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">first and the later multiply cancels exactly.</text>
</svg>

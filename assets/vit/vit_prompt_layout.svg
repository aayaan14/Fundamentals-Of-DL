<text x="168.0" y="257.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="bold" font-style="normal" fill="#2c6fa8" text-anchor="end" opacity="1.0">text_mask</text>

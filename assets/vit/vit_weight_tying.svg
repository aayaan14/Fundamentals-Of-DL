<text x="668.0" y="224.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" font-style="normal" fill="#8e6bb0" text-anchor="middle" opacity="1.0">dot against every row</text>
<rect x="60.0" y="440.0" width="880.0" height="73.0" rx="5" fill="#e4f1e1" stroke="#1e7e45" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="60.0" y="440.0" width="4" height="73.0" fill="#1e7e45"/>
<text x="74.0" y="462.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">The two operations are adjoints of one another: looking a token up, and scoring a token against the hidden</text>
<text x="74.0" y="479.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">state. Tying them forces exactly one shared vector per token and removes half a billion parameters - which is</text>
<text x="74.0" y="496.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">also why load_state_dict(..., strict=False) is safe here: the checkpoint has no separate lm_head.weight.</text>
</svg>

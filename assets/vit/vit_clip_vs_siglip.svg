<text x="755.0" y="474.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="bold" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">-(1/N) SUM_i SUM_j log sigmoid( z_ij ( -t.s_ij + b ) )</text>
<text x="755.0" y="504.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">every cell is its own binary classification, so a</text>
<text x="755.0" y="523.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">device can score its local block, swap shards and</text>
<text x="755.0" y="542.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">repeat - memory is O(block^2), never O(N^2)</text>
<rect x="40.0" y="602.0" width="940.0" height="73.0" rx="5" fill="#e4f1e1" stroke="#1e7e45" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="40.0" y="602.0" width="4" height="73.0" fill="#1e7e45"/>
<text x="54.0" y="624.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">Dropping the global normaliser is what makes SigLIP practical: batch size stops being a memory cliff, small</text>
<text x="54.0" y="641.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">batches work far better than they do for CLIP, and a learned bias b is added because at realistic batch sizes</text>
<text x="54.0" y="658.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">the labels are overwhelmingly negative (N positives against N^2 - N negatives).</text>
</svg>

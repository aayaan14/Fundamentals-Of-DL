<rect x="50.0" y="586.0" width="4" height="73.0" fill="#2c6fa8"/>
<text x="64.0" y="608.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">The N x N matrix becomes 2N classification problems. Row i asks “which of the N captions belongs to</text>
<text x="64.0" y="625.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">image i?”; column j asks “which of the N images belongs to caption j?” — and in both cases the correct</text>
<text x="64.0" y="642.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">answer sits on the diagonal.</text>
<text x="500.0" y="695.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="bold" font-style="normal" fill="#1f2a36" text-anchor="middle" opacity="1.0">L  =  1/2 ( CE(rows of S/tau)  +  CE(columns of S/tau) )</text>
<text x="500.0" y="719.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#7f8c8d" text-anchor="middle" opacity="1.0">tau is a learned temperature;  the denominator of row i needs every column, and vice versa</text>
</svg>

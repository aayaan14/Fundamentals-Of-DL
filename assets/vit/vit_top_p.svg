<rect x="60.0" y="460.0" width="440.0" height="112.0" rx="7" fill="#fff9e6" stroke="#b07808" stroke-width="1.5" fill-opacity="1.0"/>
<text x="280.0" y="484.0" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="bold" font-style="normal" fill="#b07808" text-anchor="middle" opacity="1.0">why the mask subtracts probs_sort</text>
<text x="280.0" y="508.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">mask = probs_sum - probs_sort &gt; p</text>
<text x="280.0" y="526.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0"></text>
<text x="280.0" y="544.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">without it, 'quite' (cumsum 0.910) is cut and</text>
<text x="280.0" y="562.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">only 0.860 of the mass survives</text>
<rect x="540.0" y="460.0" width="400.0" height="112.0" rx="7" fill="#e4f1e1" stroke="#1e7e45" stroke-width="1.5" fill-opacity="1.0"/>
<text x="740.0" y="484.0" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="bold" font-style="normal" fill="#1e7e45" text-anchor="middle" opacity="1.0">then renormalise and sample</text>
<text x="740.0" y="508.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">kept 5 tokens,  mass = 0.910</text>
<text x="740.0" y="526.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">probs_sort.div_(probs_sort.sum(-1, keepdim=True))</text>
<text x="740.0" y="544.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">torch.multinomial(probs_sort, 1)</text>
<text x="740.0" y="562.0" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="middle" opacity="1.0">torch.gather(probs_idx, -1, next_token)</text>
<rect x="60.0" y="592.0" width="880.0" height="73.0" rx="5" fill="#e8f4f8" stroke="#2c6fa8" stroke-width="1.3" fill-opacity="1.0"/>
<rect x="60.0" y="592.0" width="4" height="73.0" fill="#2c6fa8"/>
<text x="74.0" y="614.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">Temperature is applied before the sort (logits / T), top-p after it. The final gather is easy to forget:</text>
<text x="74.0" y="631.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">multinomial returns an index into the *sorted* array, so it has to be mapped back through probs_idx to a</text>
<text x="74.0" y="648.9" font-family="Georgia,'Times New Roman',serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#4a5a6a" text-anchor="start" opacity="1.0">real vocabulary id.</text>

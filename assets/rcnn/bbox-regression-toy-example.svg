<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Toy bounding box regression example</title>
  <desc id="desc">A proposal box [10,10,30,30] is encoded relative to a ground truth box [15,12,39,36] as offsets [0.35,0.20,0.182,0.182], then decoded back to the ground truth box.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1320" height="760" fill="#f8fafc"/>
  <rect x="44" y="38" width="1232" height="684" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <text x="82" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Toy example: encode relative offsets, not absolute corners</text>
  <text x="82" y="128" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Proposal P = [10, 10, 30, 30] and ground truth G = [15, 12, 39, 36]</text>

  <g transform="translate(82 174)">
    <rect x="0" y="0" width="420" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <line x1="52" y1="300" x2="370" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <line x1="52" y1="300" x2="52" y2="44" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="378" y="306" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">x</text>
    <text x="46" y="34" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">y</text>

    <rect x="120" y="136" width="134" height="134" fill="#dbeafe" fill-opacity="0.5" stroke="#2563eb" stroke-width="5"/>
    <rect x="154" y="96" width="160" height="160" fill="#ffe4e6" fill-opacity="0.46" stroke="#e11d48" stroke-width="5"/>

    <circle cx="187" cy="203" r="6" fill="#2563eb"/>
    <circle cx="234" cy="176" r="6" fill="#e11d48"/>
    <path d="M 187 203 L 234 176" stroke="#475569" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-slate)"/>

    <text x="110" y="294" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">P [10,10,30,30]</text>
    <text x="180" y="86" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#be123c">G [15,12,39,36]</text>
    <text x="104" y="122" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1e40af">w=20, h=20</text>
    <text x="246" y="180" font-family="Inter, Arial, sans-serif" font-size="16" fill="#be123c">w=24, h=24</text>
    <text x="206" y="220" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">center moves</text>
  </g>

  <g transform="translate(548 178)">
    <rect x="0" y="0" width="318" height="156" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="26" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">1. Convert to center-size</text>
    <text x="26" y="82" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">P: center=(20,20), size=(20,20)</text>
    <text x="26" y="116" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9f1239">G: center=(27,24), size=(24,24)</text>
  </g>

  <g transform="translate(548 372)">
    <rect x="0" y="0" width="318" height="164" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="26" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">2. Encode target offsets</text>
    <text x="26" y="82" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3412">tx=(27-20)/20 = 0.35</text>
    <text x="26" y="114" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3412">ty=(24-20)/20 = 0.20</text>
    <text x="26" y="146" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3412">tw=th=log(24/20) = 0.182</text>
  </g>

  <g transform="translate(910 184)">
    <rect x="0" y="0" width="310" height="346" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="26" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#9d174d">3. Decode prediction</text>
    <text x="26" y="82" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">pred = [0.35, 0.20, 0.182, 0.182]</text>
    <line x1="26" y1="106" x2="284" y2="106" stroke="#f9a8d4"/>
    <text x="26" y="144" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gx = 0.35 x 20 + 20 = 27</text>
    <text x="26" y="176" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gy = 0.20 x 20 + 20 = 24</text>
    <text x="26" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gw = exp(0.182) x 20 = 24</text>
    <text x="26" y="240" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gh = exp(0.182) x 20 = 24</text>
    <line x1="26" y1="264" x2="284" y2="264" stroke="#f9a8d4"/>
    <text x="26" y="302" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9d174d">Recovered box:</text>
    <text x="26" y="332" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#be123c">[15, 12, 39, 36]</text>
  </g>

  <path d="M 502 354 C 528 354 522 256 548 256" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow-slate)"/>
  <path d="M 706 334 L 706 372" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow-slate)"/>
  <path d="M 866 454 C 894 454 884 356 910 356" fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#arrow-rose)"/>

  <g transform="translate(82 604)">
    <rect x="0" y="0" width="1156" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Key idea:</text>
    <text x="132" y="44" font-family="Inter, Arial, sans-serif" font-size="21" fill="#334155">the network learns relative shifts and log-scale resizing, which transfers better than absolute image coordinates.</text>
  </g>
</svg>

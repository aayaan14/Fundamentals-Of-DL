<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Bounding box regression with corner coordinates</title>
  <desc id="desc">A proposal box and a ground-truth box stored as bottom-left and top-right coordinates are converted to center-size form for regression and then decoded back to corner coordinates.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect x="56" y="48" width="1088" height="584" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft-shadow)"/>

  <text x="92" y="108" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Corner coordinates to R-CNN regression targets</text>
  <text x="92" y="146" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Stored boxes use bottom-left and top-right corners; regression still happens in center-size space.</text>

  <g transform="translate(86 198)">
    <rect x="0" y="0" width="426" height="342" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <line x1="40" y1="296" x2="378" y2="296" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="40" y1="296" x2="40" y2="42" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="386" y="302" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">x</text>
    <text x="34" y="32" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">y</text>

    <rect x="100" y="140" width="166" height="110" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="5"/>
    <rect x="164" y="84" width="190" height="142" fill="#ffe4e6" fill-opacity="0.45" stroke="#e11d48" stroke-width="5"/>

    <circle cx="183" cy="195" r="6" fill="#2563eb"/>
    <circle cx="259" cy="155" r="6" fill="#e11d48"/>

    <circle cx="100" cy="250" r="5" fill="#2563eb"/>
    <circle cx="266" cy="140" r="5" fill="#2563eb"/>
    <circle cx="164" cy="226" r="5" fill="#e11d48"/>
    <circle cx="354" cy="84" r="5" fill="#e11d48"/>

    <text x="88" y="274" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">P(x1,y1)</text>
    <text x="222" y="130" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">P(x2,y2)</text>
    <text x="142" y="247" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#be123c">G(x1,y1)</text>
    <text x="300" y="74" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#be123c">G(x2,y2)</text>

    <text x="148" y="189" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e40af">P center</text>
    <text x="270" y="151" font-family="Inter, Arial, sans-serif" font-size="17" fill="#9f1239">G center</text>
  </g>

  <g transform="translate(560 208)">
    <rect x="0" y="0" width="262" height="148" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Convert P and G</text>
    <text x="24" y="78" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">center = ((x1+x2)/2,</text>
    <text x="102" y="104" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">(y1+y2)/2)</text>
    <text x="24" y="132" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e40af">size = (x2-x1, y2-y1)</text>
  </g>

  <g transform="translate(560 392)">
    <rect x="0" y="0" width="262" height="122" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Regression target</text>
    <text x="24" y="74" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3412">tx, ty: normalized shift</text>
    <text x="24" y="102" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3412">tw, th: log-scale resize</text>
  </g>

  <g transform="translate(864 218)">
    <rect x="0" y="0" width="226" height="286" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="24" y="42" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9d174d">Decode prediction</text>
    <text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gx = Pw tx + Px</text>
    <text x="24" y="116" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gy = Ph ty + Py</text>
    <text x="24" y="148" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gw = Pw exp(tw)</text>
    <text x="24" y="180" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">Gh = Ph exp(th)</text>
    <line x1="24" y1="208" x2="202" y2="208" stroke="#f9a8d4"/>
    <text x="24" y="244" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">corners = center</text>
    <text x="24" y="272" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9d174d">+/- half size</text>
  </g>

  <path d="M 512 358 C 530 358 536 282 560 282" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 512 358 C 530 358 536 454 560 454" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 822 454 C 846 454 842 361 864 361" fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#arrow-rose)"/>

  <g transform="translate(92 574)">
    <rect x="0" y="0" width="22" height="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="34" y="18" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Proposal box P</text>
    <rect x="174" y="0" width="22" height="22" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
    <text x="208" y="18" font-family="Inter, Arial, sans-serif" font-size="17" fill="#334155">Ground-truth / predicted box G</text>
  </g>
</svg>
